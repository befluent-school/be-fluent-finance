# Nginx — Be Fluent Finance. Copie para /etc/nginx/sites-available/financeiro,
# troque financeiro.befluentschool.com.br pelo domínio final e ative:
#   sudo ln -s /etc/nginx/sites-available/financeiro /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d financeiro.befluentschool.com.br   (HTTPS + renovação automática)
#
# Os nomes das zonas têm prefixo "financeiro_" para não colidir com as dos
# outros sistemas da VPS (limit_req_zone é global no Nginx).

limit_req_zone $binary_remote_addr zone=financeiro_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=financeiro_geral:10m rate=20r/s;

server {
    listen 80;
    server_name financeiro.befluentschool.com.br;

    # Upload de extrato bancário / planilha de alunos.
    client_max_body_size 10m;

    # Depois do certbot: HSTS (só HTTPS por 1 ano). O certbot cria o bloco
    # "listen 443"; confira que esta linha ficou dentro dele.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Login, 2FA e recuperação de senha: limite extra contra força bruta
    # (além do limite por e-mail/IP que a aplicação aplica no banco).
    # As Server Actions são POST para a própria página.
    location ~ ^/(login|esqueci-senha|redefinir-senha|onboarding/2fa-setup)$ {
        limit_req zone=financeiro_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3300;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
    }

    # Abelha (assistente com IA): lê fotos/PDFs de extrato e pode encadear várias
    # consultas — precisa de upload maior e mais tempo de resposta.
    location = /api/abelha {
        limit_req zone=financeiro_geral burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 50m;
        proxy_pass http://127.0.0.1:3300;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        limit_req zone=financeiro_geral burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3300;
        include /etc/nginx/proxy_params;   # Host, X-Real-IP, X-Forwarded-For, X-Forwarded-Proto
        proxy_http_version 1.1;
        proxy_read_timeout 120s;           # insights de IA podem levar alguns segundos
    }
}
